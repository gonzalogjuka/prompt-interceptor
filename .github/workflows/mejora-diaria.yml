# Una mejora por día: Claude Code (con el token de la suscripción de Gonzalo) revisa tests y código,
# hace un cambio chico y verificado, y el workflow abre un PR. Claude no tiene permisos de git/push:
# solo edita archivos y corre los tests; el commit y el PR los hace este workflow.
name: Mejora diaria (Claude)

on:
  schedule:
    - cron: "17 9 * * *"   # 06:17 en Argentina (UTC-3)
  workflow_dispatch:         # correrlo a mano desde la pestaña Actions

concurrency:
  group: mejora-diaria
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  mejora:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests antes del cambio
        run: python -m pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Claude busca y aplica una mejora
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat .github/claude-daily/PROMPT.md)" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(python -m pytest:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(gh pr list:*),Bash(gh pr view:*)" \
            --max-turns 80 \
            --output-format text | tee "$RUNNER_TEMP/claude.log"

      - name: Tests después del cambio
        run: python -m pytest

      - name: Abrir PR
        run: |
          body="$RUNNER_TEMP/pr.md"
          if [ -f .daily-pr.md ]; then mv .daily-pr.md "$body"; else echo "Mejora diaria $(date +%F)" > "$body"; fi
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Sin cambios hoy."; exit 0
          fi
          title="$(head -n1 "$body")"
          branch="claude/mejora-$(date +%F)-${GITHUB_RUN_ID}"
          git config user.name "claude-mejora-diaria[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "$title" -m "Mejora diaria automática (run ${GITHUB_RUN_ID})." \
            -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git push origin "$branch"
          tail -n +2 "$body" > "$RUNNER_TEMP/pr-body.md"
          printf '\n\n---\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n' >> "$RUNNER_TEMP/pr-body.md"
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Guardar lo que hizo Claude
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-log-${{ github.run_id }}
          path: ${{ runner.temp }}/claude.log
          if-no-files-found: ignore
          retention-days: 14
